name: Deploy BidCheck (Cloudflare)

# GitHub 저장소 Secrets 에 아래 값을 등록하면 D1 생성, DB 마이그레이션, 비밀값 등록, 배포까지 자동으로 수행한다.
#   CLOUDFLARE_API_TOKEN (필수), CLOUDFLARE_ACCOUNT_ID (선택: 계정이 하나면 자동 인식)
#   ANTHROPIC_API_KEY, G2B_SERVICE_KEY, APP_PASSWORD (앱 동작에 필요)
on:
  push:
    branches: [main, claude/elegant-hopper-x2nrfs]
    paths: ["bidcheck/**", ".github/workflows/deploy-bidcheck.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-bidcheck
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidcheck
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bidcheck/package-lock.json
      - name: Use account id if provided
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - run: npm run lint

      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          npm run build
          echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다 (빌드 검증만 수행)."

      - name: Check Cloudflare account
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("토큰 상태:", j.success ? j.result.status : JSON.stringify(j.errors))})'
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID 시크릿을 등록하세요"; exit 1; fi

      - name: Ensure D1 database
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          find_id() {
            npx wrangler d1 list --json > /tmp/d1.json
            node -e 'const s=require("fs").readFileSync("/tmp/d1.json","utf8");const j=JSON.parse(s.slice(s.indexOf("[")));const db=j.find(x=>x.name==="bidcheck");process.stdout.write(db?db.uuid:"")'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "D1 데이터베이스 생성"
            npx wrangler d1 create bidcheck
            ID=$(find_id)
          fi
          test -n "$ID"
          echo "D1 database_id: $ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run db:migrate:remote

      - name: Build & deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          npm run build
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "## BidCheck 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "접속 주소: ${URL:-(deploy.log 확인)}" >> "$GITHUB_STEP_SUMMARY"
          echo "BIDCHECK_URL=$URL"

      - name: Upload app secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          node -e '
            const o = {};
            for (const k of ["ANTHROPIC_API_KEY", "G2B_SERVICE_KEY", "APP_PASSWORD"]) if (process.env[k]) o[k] = process.env[k];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(o));
            console.log("등록할 비밀값:", Object.keys(o).join(", ") || "(없음)");
          '
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json --name bidcheck; fi
          rm -f /tmp/secrets.json
